<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prepwise</title>

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" 
    rel="stylesheet"
  >
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fdfdfd;
    }

    .btn-generate {
      background-color: green;
      border-color: green;
      color: white;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-generate:hover {
      background-color: #006400;
      border-color: #006400;
      color: white;
    }

    #ingredientInput {
      border-radius: 10px;
      padding: 10px 15px;
      border: 1px solid #dee2e6;
    }
    
    #ingredientInput:focus {
      border-color: green;
      box-shadow: 0 0 0 0.25rem rgba(0, 128, 0, 0.25);
    }

    .green-tag {
      background-color: rgba(34, 139, 34, 0.18);
      color: #1f7a1f;
      border: 1px solid rgba(34, 139, 34, 0.35);
      backdrop-filter: blur(6px);
      font-weight: 500;
    }

    #recipeResults::-webkit-scrollbar {
      height: 8px;
    }
    #recipeResults::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    #recipeResults::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 10px;
    }
    #recipeResults::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
</head>

<body>

  <div class="container mt-5 mb-5">
    <h1 class="text-center fw-bold display-4" style="color: green;">Prepwise</h1>
    <p class="text-center text-muted small mb-4">Add the ingredients you have, we'll create recipes for you</p>
    
    <div class="row justify-content-center">
      <div class="col-12 d-flex justify-content-center mb-4">
        <div class="card mx-auto rounded-4 shadow-sm" style="width: 100%; max-width: 40rem;">
          <div class="card-body text-center p-4">
            <h3 class="fw-bold mb-3">Your Ingredients</h3>
            <input
              type="text"
              id="ingredientInput"
              class="form-control"
              placeholder="Type an ingredient..."
            >
            <ul id="suggestions" class="list-group mt-2"></ul>
            <div id="tags" class="d-flex flex-wrap gap-2 mt-3"></div>
          </div>
        </div>
      </div>

      <div class="col-12 text-center mb-4">
        <img src="media/veggie_bowl1.png" class="img-fluid rounded-4" style="max-height: 300px; width: auto; object-fit: cover;" alt="Delicious Recipe Graphic">
      </div>

      <div class="col-12 text-center">
        <button id="generateBtn" class="btn btn-generate py-2 px-4 shadow-sm" type="button">
          <span id="btnText">
            <i class="bi bi-stars me-2"></i>Generate Recipes
          </span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
        
        <div id="recipeResults" class="mt-5"></div>
      </div>
    </div>  
  </div>

  <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 position-relative border-0 shadow">
        <div class="modal-body p-0">
          <button type="button" class="btn-close position-absolute top-0 end-0 m-3 bg-white p-2 rounded-circle shadow-sm" data-bs-dismiss="modal" aria-label="Close" style="z-index: 1055;"></button>
          <img id="modalRecipeImg" src="" class="img-fluid w-100 rounded-top-4" style="max-height: 260px; object-fit: contain;" alt="Recipe Banner Graphic">
          <div class="p-4">
            <h3 id="modalRecipeName" class="fw-bold text-success mb-2"></h3>
            <hr>
            <div class="row">
              <div class="col-md-5 mb-4 mb-md-0">
                <h5 class="fw-bold text-dark"><i class="bi bi-egg-fried text-success me-2"></i>Ingredients</h5>
                <ul id="modalRecipeIngredients" class="list-group list-group-flush mt-2"></ul>
              </div>
              <div class="col-md-7">
                <h5 class="fw-bold text-dark"><i class="bi bi-list-ol text-success me-2"></i>Instructions</h5>
                <ol id="modalRecipeSteps" class="list-group list-group-numbered list-group-flush mt-2"></ol>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
